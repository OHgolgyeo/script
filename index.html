<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오골계 스크립트 도서관</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐧</text></svg>">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap');

  :root{
    --bg: #fffcfb;
    --panel: #fff4f8;
    --panel-raised: #ffe7f0;
    --border: #f6d7e4;
    --text: #40303a;
    --text-muted: #a9879a;
    --text-faint: #cdb0be;
    --accent: #ef8fb8;
    --accent-deep: #d8558f;
    --accent-dim: #fbdcea;
    --code-bg: #fdf6f9;
    --sans: 'Space Grotesk', 'IBM Plex Sans KR', sans-serif;
    --kr: 'IBM Plex Sans KR', 'Space Grotesk', sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
  }

  * { box-sizing: border-box; }

  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--kr);
    min-height:100vh;
  }

  a { color: var(--accent); }

  .app{
    display:flex;
    min-height:100vh;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width: 300px;
    flex-shrink:0;
    border-right: 1px solid var(--border);
    border-bottom: none;
    display:flex;
    flex-direction:column;
    background: var(--panel);
    box-shadow: 2px 0 12px rgba(216, 85, 143, 0.05);
    max-height: none;
  }

  .brand{
    padding: 24px 20px 30px;
    border-bottom: none;
  }
  .brand-mark{
    font-family: var(--sans);
    font-weight:700;
    font-size: 20px;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  .brand-mark span{ color: var(--accent); }
  .brand-repo{
    margin-top: 6px;
    font-size: 12.5px;
    color: var(--text-muted);
    font-family: var(--mono);
    word-break: break-all;
  }

  .sidebar-status{
    padding: 0 20px 18px;
    font-size: 12.5px;
    color: var(--text-faint);
  }

  .categories{
    flex:1;
    overflow-y:auto;
    padding: 4px 0 24px;
  }

  .category{ margin-top: 6px; }
  .category-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 10px 20px 8px;
    cursor:pointer;
    user-select:none;
  }
  .category-title{
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
  }
  .category-count{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-faint);
  }
  .category-chevron{
    font-size: 10px;
    color: var(--text-faint);
    transition: transform .15s ease;
    margin-left: 8px;
  }
  .category.collapsed .category-chevron{ transform: rotate(-90deg); }
  .category.collapsed .script-list{ display:none; }

  .script-list{ list-style:none; margin:0; padding: 6px 8px 20px; }
  .script-item{
    display:block;
    word-break: keep-all;
    overflow-wrap: break-word;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    padding: 8px 12px;
    border-radius: 10px;
    cursor:pointer;
    line-height:1.4;
    word-break: break-word;
  }
  .script-item:hover{ background: var(--panel-raised); }
  .script-item.active{
    background: var(--accent-dim);
    color: var(--accent-deep);
    font-weight: 600;
  }

  .empty-note{
    padding: 8px 20px 4px;
    font-size: 12px;
    color: var(--text-faint);
    font-style: italic;
  }

  /* ---------- Main ---------- */
  .main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
  }

  .welcome{
    margin: auto;
    text-align:center;
    color: var(--text-muted);
    max-width: 550px;
    padding: 40px;
  }
  .welcome h1{
    font-family: var(--sans);
    color: var(--text);
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 10px;
  }
  .welcome p{ font-size: 14px; line-height:1.7; margin:0; }

  .viewer{ display:none; flex-direction:column; flex:1; min-height:0; }
  .viewer.visible{ display:flex; }

  .viewer-header{
    padding: 24px 32px 18px;
    border-bottom: none;
    flex-shrink:0;
  }
  .viewer-title{
    font-family: var(--sans);
    font-size: 21px;
    font-weight: 600;
    color: var(--text);
    margin: 0 0 4px;
    word-break: break-word;
    visibility: hidden;
  }
  .viewer-path{
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-faint);
    visibility: hidden;
  }
  .viewer-path a{ text-decoration:none; }
  .viewer-path a:hover{ text-decoration:underline; }

  .viewer-body{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction: row;
  }

  .desc-panel{
    width: 500px;
    flex-shrink:0;
    padding: 22px 24px 22px 34px;
    border-right: none;
    overflow-y:auto;
  }
  .desc-label{
    font-family: var(--sans);
    font-size: 12px;
    font-weight:600;
    color: var(--text-faint);
    margin-bottom: 8px;
  }
  .desc-body{
    font-size: 14px;
    line-height: 1.75;
    color: var(--text);
    white-space: pre-wrap;
    word-break: keep-all;
    overflow-wrap: break-word;
  }
  .desc-body.empty{ color: var(--text-faint); font-style: italic; }

  .desc-actions{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:6px;
    margin-top:14px;
  }

  .version-picker{
    display:flex;
    flex-wrap:wrap;
    gap: 6px;
    margin: 0;
  }
  .version-picker:empty{ display:none; margin:0; }
  .version-pill{
    font-family: var(--mono);
    word-break: keep-all;
    overflow-wrap: break-word;
    font-size: 12px;
    background: #fff;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 5px 12px;
    border-radius: 999px;
    cursor:pointer;
  }
  .version-pill:hover{ border-color: var(--accent); color: var(--accent-deep); }
  .version-pill.active{
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .version-path{ display:none !important; }

  .blog-link{
    display:none;
    align-items:center;
    min-height: 29px;
    padding: 5px 12px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: #fff;
    color: var(--accent-deep);
    font-family: var(--mono);
    font-size: 12px;
    text-decoration:none;
    white-space:nowrap;
    word-break: keep-all;
    overflow-wrap: break-word;
  }
  .blog-link.visible{
    display:inline-flex;
    margin-top: 14px;
  }
  .blog-link:hover{ border-color: var(--accent); background: var(--accent-dim); }

  .desc-title{
    font-family: var(--sans);
    font-size: 19px;
    font-weight: 700;
    color: var(--accent-deep);
    margin: 0 0 10px;
  }
  .desc-text{
    font-size: 14px;
    line-height: 1.75;
    color: #1a1216;
    white-space: pre-wrap;
  }
  .desc-frame{
    width: 100%;
    border: none;
    display: block;
    min-height: 40px;
  }

  .code-panel{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
  }
  .code-toolbar{
    display:flex;
    align-items:center;
    justify-content:flex-start;
    gap: 15px;
    padding: 16px 24px 10px;
    flex-shrink:0;
  }
  .code-label{
    font-family: var(--sans);
    font-size: 12px;
    font-weight:600;
    color: var(--text-faint);
  }
  .copy-btn{
    font-family: var(--mono);
    font-size: 12px;
    background: #fff;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 6px 14px;
    border-radius: 999px;
    cursor:pointer;
  }
  .copy-btn:hover{ color: var(--accent-deep); border-color: var(--accent); }
  .copy-btn.copied{ color: #fff; background: var(--accent); border-color: var(--accent); }

  .code-scroll{
    flex:1;
    overflow:auto;
    background: var(--code-bg);
    margin: 0 24px 24px;
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 2px 10px rgba(216, 85, 143, 0.06);
  }
  .code-scroll pre{
    margin:0;
    padding: 18px 20px;
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.65;
    color: #4a3a44;
    white-space: pre;
  }

  .loading, .error{
    padding: 32px;
    font-size: 13px;
    color: var(--text-muted);
    font-family: var(--mono);
  }
  .error{ color: #c9455a; }

  ::-webkit-scrollbar{ width: 10px; height:10px; }
  ::-webkit-scrollbar-track{ background: transparent; }
  ::-webkit-scrollbar-thumb{ background: var(--border); border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover{ background: var(--accent-dim); }

  @media (max-width: 760px){
    .app{ flex-direction:column; }
    .sidebar{ width:100%; max-height: 40vh; border-right:none; border-bottom:1px solid var(--border); }
    .viewer-body{ flex-direction: column; }
    .desc-panel{ width:100%; max-height: 30vh; border-right:none; border-bottom:1px solid var(--border); }
    .viewer-header{ padding-left:18px; padding-right:18px; }
    .desc-panel{ padding-left:18px; padding-right:18px; }
    .code-toolbar{ padding-left:18px; padding-right:18px; }
    .code-scroll{ margin-left:18px; margin-right:18px; }
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">🐧오골계 <span>스크립트 도서관</span></div>
      <div class="brand-repo" id="repoLabel">github.com/OHgolgyeo/script</div>
    </div>
    <div class="sidebar-status" id="status"></div>
    <nav class="categories" id="categories"></nav>
  </aside>

  <main class="main">
    <div class="welcome" id="welcome">
      <h1>보고 싶은 스크립트를 선택해주세요.</h1>
      <p>코드와 설명, 포스타입 링크를 확인 할 수 있습니다.</p>
    </div>

    <div class="viewer" id="viewer">
      <div class="viewer-header">
        <h2 class="viewer-title" id="scriptTitle"></h2>
        <div class="viewer-path"><a id="scriptLink" href="#" target="_blank" rel="noopener"></a></div>
      </div>
      <div class="viewer-body">
        <div class="desc-panel">
          <div class="version-path" id="versionPath"></div>
          <div class="desc-body" id="descBody"></div>
          <div class="desc-actions">
            <div class="version-picker" id="versionPicker"></div>
            <a class="blog-link" id="blogLink" href="#" target="_blank" rel="noopener">배포 블로그</a>
          </div>
        </div>
        <div class="code-panel">
          <div class="code-toolbar">
            <div class="code-label">코드</div>
            <button class="copy-btn" id="copyBtn">복사</button>
          </div>
          <div class="code-scroll">
            <pre id="codeBody"></pre>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
const REPO = 'OHgolgyeo/script';
// 저장소 루트의 각 폴더를 하나의 프로젝트 버튼으로 표시합니다.
// 스크립트 종류(모드/API, Tampermonkey 등)는 별도 카테고리로 구분하지 않습니다.

const statusEl = document.getElementById('status');
const categoriesEl = document.getElementById('categories');
const welcomeEl = document.getElementById('welcome');
const viewerEl = document.getElementById('viewer');
const scriptTitleEl = document.getElementById('scriptTitle');
const scriptLinkEl = document.getElementById('scriptLink');
const versionPickerEl = document.getElementById('versionPicker');
const versionPathEl = document.getElementById('versionPath');
const blogLinkEl = document.getElementById('blogLink');
const descBodyEl = document.getElementById('descBody');
const codeBodyEl = document.getElementById('codeBody');
const copyBtn = document.getElementById('copyBtn');

let activeItemEl = null;

// 지금 열려있는 폴더의 버전 파일 목록/알약버튼 — 설명 문서(iframe) 안의
// 체크박스가 postMessage로 신호를 보내면 여기서 파일을 찾아 로드함
let currentVersions = [];
let currentPills = [];

window.addEventListener('message', (event) => {
  if (!event.data || event.data.type !== 'select-version') return;
  const file = currentVersions.find(f => f.name === event.data.file);
  if (!file){
    console.warn('설명 문서의 data-file과 일치하는 파일을 못 찾음:', event.data.file);
    return;
  }
  const pillIdx = currentVersions.indexOf(file);
  loadCodeInto(file, currentPills[pillIdx], currentPills);
});

// 폴더 하나(파일+폴더 전부)를 가져옴
async function fetchEntries(path){
  const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`);
  if (!res.ok){
    if (res.status === 404) return [];
    throw new Error(`${path} 목록을 가져오지 못함 (${res.status})`);
  }
  return await res.json();
}

// 폴더 안의 파일만 가져옴 (하위 폴더는 무시)
async function fetchFiles(path){
  const entries = await fetchEntries(path);
  return entries.filter(item => item.type === 'file');
}

function extractDescription(content, filename){
  const trimmed = content.trimStart();

  // 템퍼몽키 스타일: ==UserScript== 메타 블록에서 @description 추출
  if (trimmed.startsWith('// ==UserScript==')){
    const block = trimmed.split('==/UserScript==')[0];
    const descMatch = block.match(/@description\s+(.+)/);
    const nameMatch = block.match(/@name\s+(.+)/);
    const lines = [];
    if (nameMatch) lines.push(nameMatch[1].trim());
    if (descMatch) lines.push(descMatch[1].trim());
    if (lines.length) return lines.join('\n');
  }

  // 일반 스타일: 맨 위 /** ... */ 블록 통째로 사용
  const blockMatch = trimmed.match(/^\/\*\*([\s\S]*?)\*\//);
  if (blockMatch){
    return blockMatch[1]
      .split('\n')
      .map(line => line.replace(/^\s*\*\s?/, ''))
      .join('\n')
      .trim();
  }

  // 그것도 없으면 맨 위 연속된 // 줄들을 사용
  const lines = trimmed.split('\n');
  const commentLines = [];
  for (const line of lines){
    if (line.trim().startsWith('//')){
      commentLines.push(line.trim().replace(/^\/\/\s?/, ''));
    } else if (commentLines.length){
      break;
    } else if (line.trim() === ''){
      continue;
    } else {
      break;
    }
  }
  return commentLines.join('\n').trim();
}

function resetViewer(title, linkText, linkHref){
  welcomeEl.style.display = 'none';
  viewerEl.classList.add('visible');

  scriptTitleEl.textContent = title;
  scriptLinkEl.textContent = linkText;
  scriptLinkEl.href = linkHref;
  versionPickerEl.innerHTML = '';
  versionPathEl.innerHTML = '';
  blogLinkEl.href = '#';
  blogLinkEl.classList.remove('visible');
  descBodyEl.textContent = '불러오는 중…';
  descBodyEl.classList.remove('empty');
  codeBodyEl.textContent = '';
  copyBtn.textContent = '복사';
  copyBtn.classList.remove('copied');
  currentVersions = [];
  currentPills = [];
}

function loadCodeInto(file, pillEl, pillGroup){
  if (pillGroup){
    pillGroup.forEach(p => p.classList.remove('active'));
    if (pillEl) pillEl.classList.add('active');
  }
  versionPathEl.innerHTML = '';
  codeBodyEl.textContent = '불러오는 중…';
  fetch(file.download_url)
    .then(res => {
      if (!res.ok) throw new Error(`파일을 가져오지 못함 (${res.status})`);
      return res.text();
    })
    .then(content => { codeBodyEl.textContent = content; })
    .catch(err => { codeBodyEl.textContent = err.message; });
}

// 설명용 HTML 문서를 iframe에 그대로 렌더링 (직접 짠 스타일/구조를 그대로 살림)
function renderHtmlDescription(htmlContent){
  descBodyEl.classList.remove('empty');
  descBodyEl.innerHTML = '';

  // info.html의 <meta name="distribution-blog" content="..."> 값을 읽어
  // 버전 버튼 옆에 '배포 블로그' 링크를 보여줌.
  const parsed = new DOMParser().parseFromString(htmlContent, 'text/html');
  const blogMeta = parsed.querySelector('meta[name="distribution-blog"]');
  const blogUrl = blogMeta?.getAttribute('content')?.trim();
  if (blogUrl){
    blogLinkEl.href = blogUrl;
    blogLinkEl.classList.add('visible');
  } else {
    blogLinkEl.href = '#';
    blogLinkEl.classList.remove('visible');
  }

  const iframe = document.createElement('iframe');
  iframe.className = 'desc-frame';

  // 설명은 iframe 안에 렌더링되므로 부모 페이지의 줄바꿈 CSS가 전달되지 않습니다.
  // info HTML 안에도 어절 단위 줄바꿈 규칙을 강제로 추가합니다.
  const wrapStyle = `
    <style id="archive-word-wrap">
      html, body, p, li, div, span, h1, h2, h3, h4, h5, h6, a, strong, em {
        word-break: keep-all !important;
        overflow-wrap: break-word !important;
      }
    </style>`;
  const srcdocHtml = /<\/head>/i.test(htmlContent)
    ? htmlContent.replace(/<\/head>/i, wrapStyle + '</head>')
    : wrapStyle + htmlContent;

  iframe.srcdoc = srcdocHtml;
  iframe.addEventListener('load', () => {
    try {
      const h = iframe.contentDocument.documentElement.scrollHeight;
      iframe.style.height = h + 'px';
    } catch (e) { /* 무시 */ }
  });
  descBodyEl.appendChild(iframe);
}

// 일반 스크립트 파일: 설명은 파일 자체의 헤더 주석에서, 코드는 파일 내용 그대로
function selectScript(item, btnEl){
  if (activeItemEl) activeItemEl.classList.remove('active');
  btnEl.classList.add('active');
  activeItemEl = btnEl;

  resetViewer(item.name, item.path, item.html_url);

  fetch(item.download_url)
    .then(res => {
      if (!res.ok) throw new Error(`파일을 가져오지 못함 (${res.status})`);
      return res.text();
    })
    .then(content => {
      const desc = extractDescription(content, item.name);
      if (desc){
        descBodyEl.textContent = desc;
        descBodyEl.classList.remove('empty');
      } else {
        descBodyEl.textContent = '이 스크립트엔 설명 주석이 없어요.';
        descBodyEl.classList.add('empty');
      }
      codeBodyEl.textContent = content;
    })
    .catch(err => {
      descBodyEl.textContent = err.message;
      descBodyEl.classList.add('empty');
    });
}

// 프로젝트 폴더: (폴더명)-info.html을 설명으로, 나머지 파일들을 스크립트 선택지로 보여줌
function selectGroup(dirItem, btnEl){
  if (activeItemEl) activeItemEl.classList.remove('active');
  btnEl.classList.add('active');
  activeItemEl = btnEl;

  resetViewer(dirItem.name, dirItem.path, dirItem.html_url);

  fetchFiles(dirItem.path)
    .then(files => {
      // 설명 파일 찾기: "(폴더이름)-info.html" 우선, 없으면 "(폴더이름).html",
      // 그것도 없으면 폴더 안의 아무 .html 파일이나 사용
      const folderName = dirItem.name;
      const descFile =
        files.find(f => f.name.toLowerCase() === `${folderName.toLowerCase()}-info.html`) ||
        files.find(f => f.name.toLowerCase() === `${folderName.toLowerCase()}.html`) ||
        files.find(f => /\.html?$/i.test(f.name));
      const versions = files.filter(f => f !== descFile);
      currentVersions = versions;

      // 설명: .html 문서를 그대로 렌더링
      if (descFile){
        fetch(descFile.download_url)
          .then(res => res.text())
          .then(content => renderHtmlDescription(content));
      } else {
        descBodyEl.textContent = '이 폴더엔 설명용 .html 문서가 없어요.';
        descBodyEl.classList.add('empty');
      }

      // 버전 선택 버튼들 (설명 문서 안 체크박스를 안 쓰는 경우를 위한 대체 수단)
      if (versions.length === 0){
        codeBodyEl.textContent = '이 폴더엔 설명 문서 말고 다른 파일이 없어요.';
        return;
      }
      const pills = [];
      versions.forEach((file, idx) => {
        const pill = document.createElement('button');
        pill.className = 'version-pill';
        pill.textContent = file.name.replace(/\.(js|user\.js)$/i, '');
        pill.addEventListener('click', () => loadCodeInto(file, pill, pills));
        pills.push(pill);
        versionPickerEl.appendChild(pill);
      });
      currentPills = pills;
      // 첫 번째 버전을 기본으로 보여줌
      loadCodeInto(versions[0], pills[0], pills);
    })
    .catch(err => {
      descBodyEl.textContent = err.message;
      descBodyEl.classList.add('empty');
    });
}

copyBtn.addEventListener('click', () => {
  const text = codeBodyEl.textContent;
  if (!text) return;
  navigator.clipboard.writeText(text).then(() => {
    copyBtn.textContent = '복사됨';
    copyBtn.classList.add('copied');
    setTimeout(() => {
      copyBtn.textContent = '복사';
      copyBtn.classList.remove('copied');
    }, 1500);
  });
});

function renderProjectButton(folder){
  const btn = document.createElement('button');
  btn.className = 'script-item';
  btn.textContent = folder.name;
  btn.addEventListener('click', () => selectGroup(folder, btn));
  return btn;
}

async function init(){
  try {
    const rootEntries = await fetchEntries('');
    const rootFolders = rootEntries.filter(item => item.type === 'dir');

    if (rootFolders.length === 0){
      const note = document.createElement('div');
      note.className = 'empty-note';
      note.textContent = '저장소 루트에 표시할 프로젝트 폴더가 없어요.';
      categoriesEl.appendChild(note);
      return;
    }

    const list = document.createElement('ul');
    list.className = 'script-list';

    rootFolders.forEach(folder => {
      const li = document.createElement('li');
      li.appendChild(renderProjectButton(folder));
      list.appendChild(li);
    });

    categoriesEl.appendChild(list);
    statusEl.textContent = `프로젝트 ${rootFolders.length}개`;
  } catch (err){
    const errEl = document.createElement('div');
    errEl.className = 'error';
    errEl.textContent = `목록을 가져오는 중 오류: ${err.message}`;
    categoriesEl.appendChild(errEl);
  }
}


init();
</script>
