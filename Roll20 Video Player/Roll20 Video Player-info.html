  <h2>Roll20 Video Player</h2>

  <p>
    Roll20에서 플에이어들에게 영상 자료를 전달할 수 있습니다.
    영상은 전체모드/채팅모드/창모드로 볼 수 있고, 확장자가 포함된 외부 링크 뿐 아니라 유튜브, 구글 드라이브, 트위터 링크로 영상을 가져올 수 있습니다.
    매크로에 <code>!컷 ?{영상 링크(확장자 포함)|}, ?{대기시간|}, ?{모드|full|map|window}, "?{저널이름|}"</code>를 저장해시면 사용하시기 편합니다.
  </p>
